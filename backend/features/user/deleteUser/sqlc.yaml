version: "2"
sql:
  - engine: "postgresql"
    queries: "queries.sql"
    schema: "../../../database/migrations"
    gen:
      go:
        package: "database"
        out: "database"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/vgarvardt/pgx-google-uuid/v5"
              type: "UUID"
