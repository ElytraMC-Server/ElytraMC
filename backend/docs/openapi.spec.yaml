openapi: 3.0.0
info:
  title: ElytraMC API
  version: 1.0.0
  description: The ElytraMC API
servers:
  - url: http://localhost:9000
    description: Development server

paths:
  /users:
    get:
      operationId: getUsers
      summary: Get users
      description: Get all users
      responses:
        "200":
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    surname:
                      type: string
              example:
                - id: 1
                  name: John
                  surname: Doe
                - id: 2
                  name: Jane
                  surname: Doe
